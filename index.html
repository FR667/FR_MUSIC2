<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">FR MUSIC - 專業音樂串流平台</title>
    <!-- 網站標籤圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/dwx4Hq8x/Adobe-Express-file.jpg">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --surface-hover: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a7a7a7;
            --accent: #fa243c;
            --border-color: #282828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 110px;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-x: hidden;
        }

        /* 頂部導覽列 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo img {
            width: 34px;
            height: 34px;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo img.rotate-animate {
            transform: rotate(-360deg) scale(1.1);
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 380px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 500px;
            border: 1px solid transparent;
            background-color: #242424;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-bar:focus {
            border-color: var(--accent);
            background-color: #121212;
            box-shadow: 0 0 15px rgba(250, 36, 60, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 15px;
            height: 15px;
        }

        /* 搜尋即時下拉清單 */
        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            display: none;
            z-index: 200;
            max-height: 320px;
            overflow-y: auto;
            padding: 8px 0;
        }

        .search-dropdown.show { display: block; }
        .dropdown-title { padding: 6px 16px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-result-item:hover { background: var(--surface-hover); }
        .search-result-thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .search-result-info { min-width: 0; flex: 1; }
        .search-result-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .settings-btn:hover { color: var(--text-primary); background: var(--surface-hover); transform: rotate(45deg); }

        /* 主要內容區 */
        main {
            flex: 1;
            padding: 30px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-banner {
            background: linear-gradient(135deg, #2b0c11 0%, #120507 100%);
            border-radius: 20px;
            padding: 35px 40px;
            margin-bottom: 35px;
            border: 1px solid rgba(250, 36, 60, 0.2);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 30px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 280px;
            height: 280px;
            background: var(--accent);
            opacity: 0.12;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
        }

        .hero-cover {
            width: 150px;
            height: 150px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .hero-content { flex: 1; }

        .hero-tag {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 500px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(250, 36, 60, 0.4);
        }

        .hero-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        section h3 {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* 全新上架專區 (最多15首) */
        .new-release-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }
        .new-release-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface-color);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .new-release-item:hover { background: var(--surface-hover); border-color: var(--border-color); }
        .new-release-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .new-release-info { flex: 1; min-width: 0; }
        .new-release-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .new-release-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 本地播放排行前 #12 專區 */
        .global12-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }
        .global12-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface-color);
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .global12-item:hover { background: var(--surface-hover); border-color: var(--border-color); }
        .global12-rank {
            font-size: 16px;
            font-weight: 800;
            width: 32px;
            text-align: center;
            color: #38bdf8;
        }
        .global12-item:nth-child(1) .global12-rank { color: #ffd700; }
        .global12-item:nth-child(2) .global12-rank { color: #c0c0c0; }
        .global12-item:nth-child(3) .global12-rank { color: #cd7f32; }

        .global12-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .global12-info { flex: 1; min-width: 0; }
        .global12-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .global12-count { font-size: 11px; color: var(--accent); font-weight: 500; }

        /* 你可能會喜歡網格 */
        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .album-card {
            background-color: var(--surface-color);
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }

        .album-card:hover {
            background-color: var(--surface-hover);
            transform: translateY(-4px);
            border-color: var(--border-color);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .album-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .album-card .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card .desc { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card .play-count-tag { font-size: 11px; color: var(--accent); margin-top: 6px; font-weight: 500; }

        /* 為您推薦 (隨機) 清單 */
        .song-list { display: flex; flex-direction: column; gap: 8px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background-color: var(--surface-color);
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.25s;
        }
        .song-item:hover { background-color: var(--surface-hover); border-color: var(--border-color); }
        .song-info { display: flex; align-items: center; gap: 14px; flex: 1; cursor: pointer; min-width: 0; }
        .song-thumb { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .song-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .song-right-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }
        .song-play-count {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .action-btn:hover { border-color: var(--text-primary); background: var(--text-primary); color: var(--bg-color); }

        /* 底部常駐播放器 */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 88px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 90;
        }

        .player-left { display: flex; align-items: center; gap: 12px; width: 260px; cursor: pointer; min-width: 0; }
        .player-left img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .player-meta { min-width: 0; flex: 1; }
        .player-meta .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-meta .status { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 550px; padding: 0 10px; }
        .player-controls { display: flex; align-items: center; gap: 16px; }
        .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.1); }
        .ctrl-btn.active { color: var(--accent); }

        .play-pause-btn {
            background: var(--text-primary);
            color: var(--bg-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .play-pause-btn:hover { transform: scale(1.1); }

        .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: var(--text-secondary); }
        .progress-bar { flex: 1; height: 6px; background: #4d4d4d; border-radius: 3px; position: relative; cursor: pointer; padding: 4px 0; }
        .progress-track { width: 100%; height: 4px; background: #4d4d4d; border-radius: 2px; position: relative; overflow: hidden; }
        .progress-filled { position: absolute; top: 0; left: 0; height: 100%; background: var(--text-primary); border-radius: 2px; width: 0%; pointer-events: none; }
        .progress-bar:hover .progress-filled { background: var(--accent); }

        .player-right { width: 220px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .volume-slider { width: 90px; accent-color: var(--text-primary); cursor: pointer; }

        /* 全螢幕播放 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-blur-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(55px) brightness(0.4);
            transform: scale(1.1);
            z-index: 1;
            transition: background-image 0.6s ease;
        }

        .modal-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2;
            pointer-events: none;
        }

        .carplay-container {
            width: 90%;
            max-width: 850px;
            background: rgba(18, 18, 22, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
            transform: scale(0.95) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.open .carplay-container {
            transform: scale(1) translateY(0);
        }

        .close-modal-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
        }
        .close-modal-btn:hover { background: rgba(255,255,255,0.25); color: var(--text-primary); }

        .carplay-left {
            position: relative;
            width: 280px;
            height: 280px;
            flex-shrink: 0;
        }

        .carplay-cover {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        /* 等化器動畫 */
        .visualizer-bars {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 30px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 10px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .v-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 3px;
            height: 6px;
            transition: height 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 8px var(--accent);
        }

        .carplay-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .carplay-song-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .carplay-song-artist {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 28px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .carplay-controls-area {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .carplay-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #audio-player { display: none; }

        /* 手機版極致優化 */
        @media(max-width: 768px) {
            header { padding: 12px 16px; }
            .logo { font-size: 17px; }
            .logo img { width: 30px; height: 30px; }
            .search-container { max-width: none; flex: 1; }
            .search-bar { padding: 8px 12px 8px 34px; font-size: 13px; }
            
            main { padding: 16px; }
            .hero-banner { 
                flex-direction: column; 
                text-align: center; 
                padding: 20px 16px; 
                gap: 16px; 
                border-radius: 16px;
                margin-bottom: 25px;
            }
            .hero-cover { width: 110px; height: 110px; border-radius: 12px; }
            .hero-title { font-size: 20px; }
            .hero-desc { font-size: 12px; margin-bottom: 15px; }
            .hero-btn { padding: 8px 20px; font-size: 12px; }
            .hero-tag { justify-content: center; font-size: 11px; }

            section h3 { font-size: 17px; margin-bottom: 12px; }
            .new-release-grid, .global12-grid { grid-template-columns: 1fr; }
            .grid-section { grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
            .album-card { padding: 10px; border-radius: 12px; }
            .album-card .title { font-size: 13px; }
            .album-card .desc { font-size: 11px; }

            .song-item { padding: 8px 12px; }
            .song-thumb { width: 38px; height: 38px; }
            .song-title { font-size: 13px; }
            .song-artist { font-size: 11px; }
            .song-play-count { display: none; }
            .action-btn { padding: 5px 12px; font-size: 11px; }

            .bottom-player { height: 76px; padding: 0 12px; }
            .player-left { width: 160px; gap: 10px; }
            .player-left img { width: 44px; height: 44px; border-radius: 6px; }
            .player-meta .title { font-size: 12px; }
            .player-meta .status { font-size: 10px; }
            .player-center { max-width: none; flex: 1; padding: 0 4px; gap: 4px; }
            .player-controls { gap: 12px; }
            .play-pause-btn { width: 32px; height: 32px; }
            .ctrl-btn svg { width: 16px; height: 16px; }
            .player-right { display: none; }

            .carplay-container {
                flex-direction: column;
                width: 95%;
                padding: 24px 16px;
                gap: 20px;
                max-height: 85vh;
                border-radius: 20px;
            }
            .carplay-left { width: 180px; height: 180px; }
            .carplay-song-title { font-size: 18px; text-align: center; }
            .carplay-song-artist { font-size: 13px; text-align: center; margin-bottom: 15px; }
            .carplay-right { width: 100%; align-items: center; }
            .carplay-controls { justify-content: space-around; width: 100%; gap: 0; }
            .close-modal-btn { top: 12px; right: 12px; width: 28px; height: 28px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header>
        <div class="logo" id="brand-title" onclick="onLogoClick()">
            <img src="https://i.ibb.co/m54LF470/Background-Eraser-20260816-214356376.png" id="logo-img" alt="Logo">
            <span id="nav-brand-text">FR MUSIC</span>
        </div>
        
        <div class="search-container">

        function fetchPlayCounts() {
            try {
                const savedCounts = localStorage.getItem('fr_music_local_play_counts');

                    playCounts = JSON.parse(savedCounts);
                } else {
                    playCounts = {};
                }

                console.error('從 localStorage 讀取播放次數失敗:', error);
                playCounts = {};

        function incrementGlobalPlayCount(songUrl) {
            try {
                const currentCount = playCounts[songUrl] || 0;

                playCounts[songUrl] = newCount;

            try {
                fetchPlayCounts();
                const response = await fetch(JSON_URL);
                playlist = await response.json();

                    const song = playlist[0];

                    playerThumb.src = song.cover;
                    modalCover.src = song.cover;
                    modalBlurBg.style.backgroundImage = `url('${song.cover}')`;

            renderNewReleases();
            renderGlobal12();
            renderYouMayLike();
            renderRandomList();
        }

        function loadUserSettings() {
            const saved = JSON.parse(localStorage.getItem('fr_music_settings')) || { language: 'zh-TW', bgTheme: '#050505' };
            document.documentElement.style.setProperty('--bg-color', saved.bgTheme);
            applyLanguage(saved.language);
            document.getElementById('setting-language').value = saved.language;
            document.getElementById('setting-bg-theme').value = saved.bgTheme;
        }

        function applyLanguage(lang) {
            const t = translations[lang] || translations['zh-TW'];
            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('dd-title').innerText = t.hotTitle;
            document.getElementById('hero-tag-text').innerText = t.heroTag;
            document.getElementById('btn-play-now').innerText = t.btnPlay;
            document.getElementById('section-new-release').innerText = t.sectionNewRelease;
            document.getElementById('section-global12').innerText = t.sectionGlobal12;
            document.getElementById('section-you-may-like').innerText = t.sectionYouMayLike;
            document.getElementById('section-all-songs').innerText = t.sectionAllSongs;
            if(!isPlaying) { playerStatus.innerText = t.playerReady; }
            document.getElementById('settings-title').innerText = t.settingsTitle;
            document.getElementById('lbl-language').innerText = t.lblLang;
            document.getElementById('lbl-bgtheme').innerText = t.lblBgTheme;
            document.getElementById('btn-cancel').innerText = t.btnCancel;
            document.getElementById('btn-save').innerText = t.btnSave;
            refreshUI();
        }

        loadUserSettings();
        loadMusicData();

        function saveSettings() {
            const language = document.getElementById('setting-language').value;
            const bgTheme = document.getElementById('setting-bg-theme').value;
            localStorage.setItem('fr_music_settings', JSON.stringify({ language, bgTheme }));
            loadUserSettings();
            closeSettings();
        }

        window.openSettings = function() { document.getElementById('settings-modal').classList.add('open'); }
        window.closeSettings = function() { document.getElementById('settings-modal').classList.remove('open'); }

        // 搜尋功能
        window.onSearchInput = function(keyword) {
            const dropdown = document.getElementById('search-dropdown');
            const resultsList = document.getElementById('search-results-list');
            resultsList.innerHTML = '';

            if (!keyword.trim()) {
                dropdown.classList.remove('show');
                return;
            }

            const matchedSongs = playlist.filter(s => 
                s.title.toLowerCase().includes(keyword.toLowerCase()) || 
                s.artist.toLowerCase().includes(keyword.toLowerCase()) ||
                s.desc.toLowerCase().includes(keyword.toLowerCase())
            );

            if (matchedSongs.length === 0) {
                const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
                const t = translations[savedLang] || translations['zh-TW'];
                resultsList.innerHTML = `<div style="padding: 10px 16px; font-size: 13px; color: var(--text-secondary);">${t.notFound}</div>`;
            } else {
                matchedSongs.forEach(song => {
                    const originalIndex = playlist.findIndex(s => s.url === song.url);
                    resultsList.innerHTML += `
                        <div class="search-result-item" onclick="selectSearchResult(${originalIndex})">
                            <img src="${song.cover}" class="search-result-thumb" alt="封面">
                            <div class="search-result-info">
                                <div class="search-result-title">${song.title}</div>
                                <div class="search-result-artist">${song.artist}</div>
                            </div>
                        </div>
                    `;
                });
            }
            dropdown.classList.add('show');
        }

        window.selectSearchResult = function(index) {
            document.getElementById('search-dropdown').classList.remove('show');
            document.getElementById('search-input').value = '';
            window.openModal();
            window.playSong(index);
        }

        window.onLogoClick = function() {
            const logoImg = document.getElementById('logo-img');
            logoImg.classList.add('rotate-animate');
            setTimeout(() => { logoImg.classList.remove('rotate-animate'); }, 800);
            document.getElementById('search-input').value = '';
            document.getElementById('search-dropdown').classList.remove('show');
            renderRandomList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 最上方：本地 NO.1 播放量最高的歌
        function setupHeroSection() {
            if (playlist.length === 0) return;
            let mostPlayedIndex = 0;
            let maxCount = -1;
            playlist.forEach((song, idx) => {
                const cnt = playCounts[song.url] || 0;
                if (cnt > maxCount) {
                    maxCount = cnt;
                    mostPlayedIndex = idx;
                }
            });

            heroSongIndex = mostPlayedIndex;
            const song = playlist[heroSongIndex];
            const count = playCounts[song.url] || 0;

            document.getElementById('hero-cover').src = song.cover;
            document.getElementById('hero-title').innerText = song.title;
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];
            document.getElementById('hero-desc').innerHTML = `${t.heroDesc} <strong style="color:var(--accent);">${count}</strong> 次 | ${song.artist}`;
        }

        // 全新上架 (最多 15 首)
        function renderNewReleases() {
            const container = document.getElementById('new-release-container');
            if (!container) return;
            container.innerHTML = '';

            const newSongs = [...playlist].slice(0, 15);

            newSongs.forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                container.innerHTML += `
                    <div class="new-release-item" onclick="openModal(); playSong(${originalIndex});">
                        <img src="${song.cover}" class="new-release-thumb" alt="封面">
                        <div class="new-release-info">
                            <div class="new-release-title">${song.title}</div>
                            <div class="new-release-artist">${song.artist}</div>
                        </div>
                    </div>
                `;
            });
        }

        // 本地播放排行前 #12
        function renderGlobal12() {
            const container = document.getElementById('global12-container');
            if (!container) return;
            container.innerHTML = '';

            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            const sortedSongs = [...playlist].sort((a, b) => {
                const countA = playCounts[a.url] || 0;
                const countB = playCounts[b.url] || 0;
                return countB - countA;
            }).slice(0, 12);

            sortedSongs.forEach((song, idx) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const count = playCounts[song.url] || 0;
                container.innerHTML += `
                    <div class="global12-item" onclick="openModal(); playSong(${originalIndex});">
                        <div class="global12-rank">#${idx + 1}</div>
                        <img src="${song.cover}" class="global12-thumb" alt="封面">
                        <div class="global12-info">
                            <div class="global12-title">${song.title}</div>
                            <div class="global12-count">${t.playCountText}: ${count} 次</div>
                        </div>
                    </div>
                `;
            });
        }

        // 你可能會喜歡
        function renderYouMayLike() {
            const gridContainer = document.getElementById('grid-section-container');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';
            
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            const recommendedSongs = [...playlist].sort(() => 0.5 - Math.random()).slice(0, 4);

            recommendedSongs.forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const count = playCounts[song.url] || 0;
                gridContainer.innerHTML += `
                    <div class="album-card" onclick="openModal(); playSong(${originalIndex});">
                        <img src="${song.cover}" alt="${song.title}">
                        <div class="title">${song.title}</div>
                        <div class="desc">${song.artist}</div>
                        <div class="play-count-tag">${t.playCountText}: ${count} 次</div>
                    </div>
                `;
            });
        }

        // 為您推薦 (隨機) 清單
        function renderRandomList() {
            const listContainer = document.getElementById('song-list-container');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            const randomizedSongs = [...playlist].sort(() => 0.5 - Math.random());

            randomizedSongs.forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const count = playCounts[song.url] || 0;
                listContainer.innerHTML += `
                    <div class="song-item">
                        <div class="song-info" onclick="openModal(); playSong(${originalIndex});">
                            <img src="${song.cover}" class="song-thumb" alt="封面">
                            <div style="min-width:0; flex:1;">
                                <div class="song-title">${song.title}</div>
                                <div class="song-artist">${song.artist}</div>
                            </div>
                        </div>
                        <div class="song-right-group">
                            <div class="song-play-count">${t.playCountText}: ${count} 次</div>
                            <button class="action-btn" onclick="playSong(${originalIndex})">${t.btnPlayList}</button>
                        </div>
                    </div>
                `;
            });
        }

        window.playSong = function(index) {
            currentIndex = index;
            const song = playlist[currentIndex];
            if (!song) return;
            
            hasCountedCurrentSong = false;

            audio.src = song.url;
            audio.play();
            isPlaying = true;
            
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            playerTitle.innerText = song.title;
            modalSongTitle.innerText = song.title;
            modalSongArtist.innerText = song.artist;
            playerThumb.src = song.cover;
            modalCover.src = song.cover;
            modalBlurBg.style.backgroundImage = `url('${song.cover}')`;
            playerStatus.innerText = t.playerPlaying;
            
            playIcon.innerHTML = pauseSvg;
            modalPlayIcon.innerHTML = pauseSvg;
        }

        window.togglePlayPause = function() {
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            if (!audio.src && playlist.length > 0) {
                window.playSong(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playIcon.innerHTML = playSvg;
                modalPlayIcon.innerHTML = playSvg;
                playerStatus.innerText = t.playerPaused;
            } else {
                audio.play();
                isPlaying = true;
                playIcon.innerHTML = pauseSvg;
                modalPlayIcon.innerHTML = pauseSvg;
                playerStatus.innerText = t.playerPlaying;
            }
        }

        window.nextSong = function() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            window.playSong(currentIndex);
        }

        window.prevSong = function() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            window.playSong(currentIndex);
        }

        window.skipTime = function(seconds) {
            if (!audio.duration) return;
            audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
        }

        window.toggleShuffle = function() {
            isShuffle = !isShuffle;
            document.querySelectorAll('.shuffle-trigger').forEach(b => b.classList.toggle('active', isShuffle));
        }

        window.toggleRepeat = function() {
            isRepeat = !isRepeat;
            document.querySelectorAll('.repeat-trigger').forEach(b => b.classList.toggle('active', isRepeat));
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100;
                updateProgressUI(percent);
                
                // 當播放超過 50% 時，記錄一次本地播放次數並寫入 localStorage
                if (percent >= 50 && !hasCountedCurrentSong) {
                    hasCountedCurrentSong = true;
                    const song = playlist[currentIndex];
                    if (song) {
                        incrementGlobalPlayCount(song.url);
                    }
                }

                const formattedCurrent = formatTime(audio.currentTime);
                const formattedDuration = formatTime(audio.duration);
                
                currentTimeEl.innerText = formattedCurrent;
                durationTimeEl.innerText = formattedDuration;
                modalCurrentTimeEl.innerText = formattedCurrent;
                modalDurationTimeEl.innerText = formattedDuration;

                if (isPlaying) {
                    document.querySelectorAll('.v-bar').forEach(bar => {
                        const randomHeight = Math.floor(Math.random() * 24) + 6;
                        bar.style.height = randomHeight + 'px';
                    });
                }
            }
        });

        function updateProgressUI(percent) {
            progressFilled.style.width = percent + '%';
            modalProgressFilled.style.width = percent + '%';
        }

        let isDragging = false;
        function setupSeekBar(barId) {
            const bar = document.getElementById(barId);
            if(!bar) return;

            const getPercent = (e) => {
                const rect = bar.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let percent = (clientX - rect.left) / rect.width;
                return Math.max(0, Math.min(1, percent));
            };

            const onStart = (e) => {
                if (!audio.duration) return;
                isDragging = true;
                const percent = getPercent(e);
                updateProgressUI(percent * 100);
            };

            const onMove = (e) => {
                if (!isDragging || !audio.duration) return;
                const percent = getPercent(e);
                updateProgressUI(percent * 100);
                const previewTime = percent * audio.duration;
                currentTimeEl.innerText = formatTime(previewTime);
                modalCurrentTimeEl.innerText = formatTime(previewTime);
            };

            const onEnd = (e) => {
                if (!isDragging || !audio.duration) return;
                isDragging = false;
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const rect = bar.getBoundingClientRect();
                let percent = (clientX - rect.left) / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                audio.currentTime = percent * audio.duration;
            };

            bar.addEventListener('mousedown', onStart);
            bar.addEventListener('mousemove', onMove);
            bar.addEventListener('mouseup', onEnd);
            bar.addEventListener('touchstart', onStart, {passive: true});
            bar.addEventListener('touchmove', onMove, {passive: true});
            bar.addEventListener('touchend', onEnd);
        }

        setupSeekBar('progress-bar');
        setupSeekBar('modal-progress-bar');

        window.setVolume = function(val) { audio.volume = val; }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        audio.addEventListener('ended', () => {
            if (isRepeat) { audio.play(); } else { window.nextSong(); }
        });

        window.openModal = function() { document.getElementById('now-playing-modal').classList.add('open'); }
        window.closeModal = function() { document.getElementById('now-playing-modal').classList.remove('open'); }
    </script>
</body>
</html>
