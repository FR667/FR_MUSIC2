<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 優化行動裝置網址列高度跳動：引入 100dvh -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">FR MUSIC - Beta 專業音樂串流平台</title>
    <!-- 網站標籤圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/dwx4Hq8x/Adobe-Express-file.jpg">
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: rgba(25, 25, 25, 0.65);
            --surface-hover: rgba(40, 40, 40, 0.75);
            --text-primary: #ffffff;
            --text-secondary: #a7a7a7;
            --accent: #fa243c;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
            --liquid-glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.03) 100%);
            --liquid-glass-border: 1px solid rgba(255, 255, 255, 0.14);
            --liquid-glass-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.45), inset 0 1px 1px 0 rgba(255, 255, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-bottom: 110px;
            transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-x: hidden;
        }

        /* 液態玻璃導覽列 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo img {
            width: 34px;
            height: 34px;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 12px rgba(250, 36, 60, 0.4);
        }

        .logo img.rotate-animate {
            transform: rotate(-360deg) scale(1.1);
        }

        .beta-badge {
            background: linear-gradient(135deg, #fa243c, #ff7657);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(250, 36, 60, 0.5);
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 380px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 500px;
            border: var(--liquid-glass-border);
            background: var(--liquid-glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-bar:focus {
            border-color: var(--accent);
            background: rgba(25, 25, 25, 0.85);
            box-shadow: 0 0 20px rgba(250, 36, 60, 0.25), var(--liquid-glass-shadow);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 15px;
            height: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .glass-btn {
            background: var(--liquid-glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--liquid-glass-border);
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 500px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 1px 2px 0 rgba(255, 255, 255, 0.4);
        }

        .settings-btn {
            background: var(--liquid-glass-bg);
            border: var(--liquid-glass-border);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 9px;
            border-radius: 50%;
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-btn:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.15); transform: rotate(45deg); }

        /* 搜尋下拉清單 */
        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: rgba(18, 18, 22, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--liquid-glass-border);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: none;
            z-index: 200;
            max-height: 320px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .search-dropdown.show { display: block; }
        .dropdown-title { padding: 6px 16px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        
        .search-result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-result-item:hover { background: rgba(255,255,255,0.08); }
        .search-result-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .search-result-thumb { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .search-result-info { min-width: 0; flex: 1; }
        .search-result-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-duration { font-size: 11px; color: var(--text-secondary); flex-shrink: 0; }

        /* 主要內容區 */
        main {
            flex: 1;
            padding: 30px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 英雄横幅 */
        .hero-banner {
            background: linear-gradient(135deg, rgba(43, 12, 17, 0.75) 0%, rgba(18, 5, 7, 0.85) 100%);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 24px;
            padding: 35px 40px;
            margin-bottom: 35px;
            border: 1px solid rgba(250, 36, 60, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            gap: 30px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 280px;
            height: 280px;
            background: var(--accent);
            opacity: 0.15;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
        }

        .hero-cover {
            width: 150px;
            height: 150px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            flex-shrink: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hero-cover:hover { transform: scale(1.03); }

        .hero-content { flex: 1; }

        .hero-tag {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .hero-btn {
            background: var(--liquid-glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 36, 60, 0.5);
            color: #fff;
            padding: 10px 24px;
            border-radius: 500px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(250, 36, 60, 0.4), inset 0 1px 2px rgba(255,255,255,0.3);
        }

        .hero-btn:hover { transform: scale(1.05); background: var(--accent); border-color: var(--accent); box-shadow: 0 12px 30px rgba(250, 36, 60, 0.7); }

        section h3 {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .new-release-grid, .global12-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        .new-release-item, .global12-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 10px 14px;
            border-radius: 14px;
            cursor: pointer;
            border: var(--liquid-glass-border);
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .new-release-item:hover, .global12-item:hover { 
            background: var(--surface-hover); 
            border-color: rgba(255,255,255,0.25); 
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.3);
        }

        .new-release-thumb, .global12-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .new-release-info, .global12-info { flex: 1; min-width: 0; }
        .new-release-title, .global12-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .new-release-artist, .global12-count { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-duration { font-size: 11px; color: var(--text-secondary); margin-left: 8px; flex-shrink: 0; }

        .global12-rank {
            font-size: 16px;
            font-weight: 800;
            width: 32px;
            text-align: center;
            color: #38bdf8;
        }
        .global12-item:nth-child(1) .global12-rank { color: #ffd700; }
        .global12-item:nth-child(2) .global12-rank { color: #c0c0c0; }
        .global12-item:nth-child(3) .global12-rank { color: #cd7f32; }

        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .album-card {
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--liquid-glass-border);
            box-shadow: var(--liquid-glass-shadow);
        }

        .album-card:hover {
            background: var(--surface-hover);
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.3);
        }

        .album-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .album-card .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card .desc { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .album-card .play-count-tag { font-size: 11px; color: var(--accent); font-weight: 500; }
        .album-card .card-duration { font-size: 11px; color: var(--text-secondary); }

        .song-list { display: flex; flex-direction: column; gap: 8px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 12px;
            border: var(--liquid-glass-border);
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.25s;
        }
        .song-item:hover { background: var(--surface-hover); border-color: rgba(255,255,255,0.25); transform: translateX(4px); }
        .song-info { display: flex; align-items: center; gap: 14px; flex: 1; cursor: pointer; min-width: 0; }
        .song-thumb { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .song-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .song-right-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .song-play-count { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
        .song-duration-tag { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-left: 8px; }

        .like-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .like-btn:hover { color: var(--accent); transform: scale(1.25); }
        .like-btn.liked { color: var(--accent); }

        .action-btn {
            background: var(--liquid-glass-bg);
            border: var(--liquid-glass-border);
            color: var(--text-primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .action-btn:hover { border-color: var(--accent); background: var(--accent); color: #fff; transform: scale(1.05); }

        /* 底部常駐播放器 */
        .bottom-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 88px;
            background: rgba(15, 15, 18, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: var(--liquid-glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 90;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }

        .player-left { display: flex; align-items: center; gap: 12px; width: 260px; cursor: pointer; min-width: 0; }
        .player-left img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .player-meta { min-width: 0; flex: 1; }
        .player-meta .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-meta .status { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 550px; padding: 0 10px; }
        .player-controls { display: flex; align-items: center; gap: 18px; }
        .ctrl-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .ctrl-btn:hover { color: var(--text-primary); transform: scale(1.15); }
        .ctrl-btn.active { color: var(--accent); }

        .play-pause-btn {
            background: var(--text-primary);
            color: var(--bg-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(255,255,255,0.35);
        }
        .play-pause-btn:hover { transform: scale(1.12); filter: brightness(1.15); }

        .progress-container { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            width: 100%; 
            font-size: 11px; 
            color: var(--text-secondary); 
        }
        .progress-container span { min-width: 30px; text-align: center; flex-shrink: 0; }
        .progress-bar { flex: 1; height: 16px; display: flex; align-items: center; position: relative; cursor: pointer; }
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; position: relative; overflow: hidden; }
        .progress-filled { position: absolute; top: 0; left: 0; height: 100%; background: var(--text-primary); border-radius: 3px; width: 0%; pointer-events: none; transition: width 0.05s linear; }
        .progress-bar:hover .progress-filled { background: var(--accent); }

        .player-right { width: 240px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .volume-slider { width: 80px; accent-color: var(--text-primary); cursor: pointer; }

        /* 特效按鈕 */
        .extra-ctrl-btn {
            background: var(--liquid-glass-bg);
            border: var(--liquid-glass-border);
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .extra-ctrl-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.3); }
        .extra-ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 12px rgba(250, 36, 60, 0.6); }

        /* 底部播放列專屬半透明等化條 */
        .bottom-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 24px;
            opacity: 0.45;
            pointer-events: none;
            padding: 0 10px;
        }
        .bottom-v-bar {
            width: 2.5px;
            background: var(--accent);
            border-radius: 2px;
            height: 4px;
            transition: height 0.08s ease;
        }

        /* 全螢幕播放 Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-blur-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            filter: blur(70px) brightness(0.35);
            transform: scale(1.15);
            z-index: 1;
            transition: background-image 0.6s ease;
        }

        .modal-overlay::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2;
            pointer-events: none;
        }

        .carplay-container {
            width: 90%;
            max-width: 880px;
            background: rgba(20, 20, 26, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: var(--liquid-glass-border);
            border-radius: 36px;
            display: flex;
            align-items: center;
            gap: 45px;
            padding: 45px;
            box-shadow: 0 50px 120px rgba(0,0,0,0.85), inset 0 1px 3px rgba(255,255,255,0.25);
            position: relative;
            z-index: 10;
            transform: scale(0.9) translateY(30px);
            transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.open .carplay-container {
            transform: scale(1) translateY(0);
        }

        .close-modal-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--liquid-glass-bg);
            border: var(--liquid-glass-border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            z-index: 20;
            box-shadow: var(--liquid-glass-shadow);
            transition: all 0.2s;
        }
        .close-modal-btn:hover { background: rgba(255,255,255,0.25); color: var(--text-primary); transform: scale(1.1); }

        .carplay-left {
            position: relative;
            width: 280px;

        function loadLocalData() {
            try {
                playCounts = JSON.parse(localStorage.getItem('fr_music_local_play_counts')) || {};
                favorites = JSON.parse(localStorage.getItem('fr_music_favorites')) || [];
                historyList = JSON.parse(localStorage.getItem('fr_music_history')) || [];
                
                const savedVol = localStorage.getItem('fr_music_volume');
                if (savedVol !== null) {
                    audio.volume = parseFloat(savedVol);
                    document.getElementById('volume-slider').value = audio.volume;
                }
            } catch (e) {
                playCounts = {};
                favorites = [];
                historyList = [];
            }
        }

        function incrementPlayCount(songUrl) {
            playCounts[songUrl] = (playCounts[songUrl] || 0) + 1;
            localStorage.setItem('fr_music_local_play_counts', JSON.stringify(playCounts));
            refreshUI();
        }

        window.toggleFavorite = function(event, songUrl) {
            event.stopPropagation();
            const index = favorites.indexOf(songUrl);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(songUrl);
            }
            localStorage.setItem('fr_music_favorites', JSON.stringify(favorites));
            refreshUI();
        }

        function addHistory(songUrl) {
            historyList = historyList.filter(url => url !== songUrl);
            historyList.unshift(songUrl);
            if (historyList.length > 30) historyList.pop();
            localStorage.setItem('fr_music_history', JSON.stringify(historyList));
        }

        async function loadMusicData() {
            try {
                loadLocalData();
                const response = await fetch(JSON_URL);
                if (!response.ok) throw new Error('網路回應不正確');
                playlist = await response.json();
            } catch (error) {
                console.warn('無法從遠端載入 data.json，已自動切換為本地快取 Fallback 資料:', error);
                playlist = FALLBACK_PLAYLIST;
            }
            
            refreshUI();
            
            if (playlist.length > 0 && !audio.src) {
                const song = playlist[0];
                playerTitle.innerText = song.title;
                modalSongTitle.innerText = song.title;
                modalSongArtist.innerText = song.artist;
                playerThumb.src = song.cover;
                modalCover.src = song.cover;
                modalBlurBg.style.backgroundImage = `url('${song.cover}')`;
                durationTimeEl.innerText = song.duration || "3:30";
                modalDurationTimeEl.innerText = song.duration || "3:30";
            }
        }

            setupHeroSection();
            renderNewReleases();

            renderRandomList();

            const saved = JSON.parse(localStorage.getItem('fr_music_settings')) || { language: 'zh-TW', bgTheme: '#050505' };

            applyLanguage(saved.language);
            document.getElementById('setting-language').value = saved.language;
            document.getElementById('setting-bg-theme').value = saved.bgTheme;

            document.getElementById('lbl-language').innerText = t.lblLang;
            document.getElementById('lbl-bgtheme').innerText = t.lblBgTheme;

        function saveSettings() {
            const language = document.getElementById('setting-language').value;

            const container = document.getElementById('favorites-list-container');
            container.innerHTML = '';

                container.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 13px;">尚無收藏的歌曲</div>`;

            favorites.forEach(url => {

                if (song) {
                    const originalIndex = playlist.findIndex(s => s.url === url);
                    container.innerHTML += `

        window.onSearchInput = function(keyword) {
            const dropdown = document.getElementById('search-dropdown');
            const resultsList = document.getElementById('search-results-list');
            resultsList.innerHTML = '';

            if (!keyword.trim()) {
                dropdown.classList.remove('show');
                return;
            }

            const matchedSongs = playlist.filter(s => 
                s.title.toLowerCase().includes(keyword.toLowerCase()) || 
                s.artist.toLowerCase().includes(keyword.toLowerCase())
            );

            if (matchedSongs.length === 0) {
                const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
                const t = translations[savedLang] || translations['zh-TW'];
                resultsList.innerHTML = `<div style="padding: 10px 16px; font-size: 13px; color: var(--text-secondary);">${t.notFound}</div>`;
            } else {
                matchedSongs.forEach(song => {
                    const originalIndex = playlist.findIndex(s => s.url === song.url);
                    resultsList.innerHTML += `
                        <div class="search-result-item" onclick="selectSearchResult(${originalIndex})">
                            <div class="search-result-left">
                                <img src="${song.cover}" class="search-result-thumb" alt="封面">
                                <div class="search-result-info">
                                    <div class="search-result-title">${song.title}</div>
                                    <div class="search-result-artist">${song.artist}</div>
                                </div>
                            </div>
                            <div class="search-result-duration">${song.duration || '3:30'}</div>
                        </div>
                    `;
                });
            }
            dropdown.classList.add('show');
        }

        function setupHeroSection() {
            if (playlist.length === 0) return;
            let mostPlayedIndex = 0;
            let maxCount = -1;
            playlist.forEach((song, idx) => {
                const cnt = playCounts[song.url] || 0;
                if (cnt > maxCount) { maxCount = cnt; mostPlayedIndex = idx; }
            });

            heroSongIndex = mostPlayedIndex;
            const song = playlist[heroSongIndex];
            const count = playCounts[song.url] || 0;

            document.getElementById('hero-cover').src = song.cover;
            document.getElementById('hero-title').innerText = `${song.title} (${song.duration || '3:30'})`;
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];
            document.getElementById('hero-desc').innerHTML = `${t.heroDesc} <strong style="color:var(--accent);">${count}</strong> 次 | ${song.artist}`;
        }

                container.innerHTML += `
                    <div class="new-release-item" onclick="openModal(); playSong(${originalIndex});">
                        <img src="${song.cover}" class="new-release-thumb" alt="封面">
                        <div class="new-release-info">
                            <div class="new-release-title">${song.title}</div>
                            <div class="new-release-artist">${song.artist}</div>
                        </div>
                        <div class="item-duration">${song.duration || '3:30'}</div>
                        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleFavorite(event, '${song.url}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                    </div>`;
            });
        }

        function renderGlobal12() {
            const container = document.getElementById('global12-container');
            if (!container) return;
            container.innerHTML = '';
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            [...playlist].sort((a, b) => (playCounts[b.url] || 0) - (playCounts[a.url] || 0)).slice(0, 12).forEach((song, idx) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const count = playCounts[song.url] || 0;
                container.innerHTML += `
                    <div class="global12-item" onclick="openModal(); playSong(${originalIndex});">
                        <div class="global12-rank">#${idx + 1}</div>
                        <img src="${song.cover}" class="global12-thumb" alt="封面">
                        <div class="global12-info">
                            <div class="global12-title">${song.title}</div>
                            <div class="global12-count">${t.playCountText}: ${count} 次</div>
                        </div>
                        <div class="item-duration">${song.duration || '3:30'}</div>
                    </div>`;
            });
        }

        function renderYouMayLike() {
            const gridContainer = document.getElementById('grid-section-container');
            if (!gridContainer) return;
            gridContainer.innerHTML = '';
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            [...playlist].sort(() => 0.5 - Math.random()).slice(0, 4).forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const count = playCounts[song.url] || 0;
                gridContainer.innerHTML += `
                    <div class="album-card" onclick="openModal(); playSong(${originalIndex});">
                        <img src="${song.cover}" alt="${song.title}">
                        <div class="title">${song.title}</div>
                        <div class="desc">${song.artist}</div>
                        <div class="card-footer">
                            <div class="play-count-tag">${t.playCountText}: ${count} 次</div>
                            <div class="card-duration">${song.duration || '3:30'}</div>
                        </div>
                    </div>`;
            });
        }

        function renderRandomList() {
            const listContainer = document.getElementById('song-list-container');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            [...playlist].sort(() => 0.5 - Math.random()).forEach((song) => {
                const originalIndex = playlist.findIndex(s => s.url === song.url);
                const count = playCounts[song.url] || 0;
                const isLiked = favorites.includes(song.url);
                listContainer.innerHTML += `
                    <div class="song-item">
                        <div class="song-info" onclick="openModal(); playSong(${originalIndex});">
                            <img src="${song.cover}" class="song-thumb" alt="封面">
                            <div style="min-width:0; flex:1;">
                                <div class="song-title">${song.title}</div>
                                <div class="song-artist">${song.artist}</div>
                            </div>
                        </div>
                        <div class="song-right-group">
                            <div class="song-duration-tag">${song.duration || '3:30'}</div>
                            <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleFavorite(event, '${song.url}')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                            <div class="song-play-count">${t.playCountText}: ${count} 次</div>
                            <button class="action-btn" onclick="playSong(${originalIndex})">${t.btnPlayList}</button>
                        </div>
                    </div>`;
            });
        }

        // 初始化 Web Audio API 與 環繞聲道/等化器 節點
        function initWebAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                sourceNode = audioCtx.createMediaElementSource(audio);
                
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 64;

                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowshelf';
                bassFilter.frequency.setValueAtTime(200, audioCtx.currentTime);
                bassFilter.gain.setValueAtTime(isBassBoosted ? 12 : 0, audioCtx.currentTime);

                // 建立左右聲道控制節點 (StereoPannerNode 若支援)
                if (audioCtx.createStereoPanner) {
                    pannerNode = audioCtx.createStereoPanner();
                    pannerNode.pan.setValueAtTime(0, audioCtx.currentTime);
                    sourceNode.connect(bassFilter);
                    bassFilter.connect(pannerNode);
                    pannerNode.connect(analyserNode);
                } else {
                    sourceNode.connect(bassFilter);
                    bassFilter.connect(analyserNode);
                }
                analyserNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 動態更新視覺化等化條（同時支援全螢幕底部整排與一般播放列半透明等化條）
        function updateVisualizer() {
            if (!analyserNode || !isPlaying) return;
            const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
            analyserNode.getByteFrequencyData(dataArray);

            // 1. 全螢幕下方整排等化條更新
            const fullBars = document.querySelectorAll('.v-bar-full');
            fullBars.forEach((bar, i) => {
                const val = dataArray[i] || 10;
                const height = Math.max(8, (val / 255) * 40);
                bar.style.height = height + 'px';
            });

            // 2. 一般底部播放列半透明等化條更新
            const bottomBars = document.querySelectorAll('.bottom-v-bar');
            bottomBars.forEach((bar, i) => {
                const val = dataArray[i] || 5;
                const height = Math.max(4, (val / 255) * 20);
                bar.style.height = height + 'px';
            });

            // 智慧自動環繞音響邏輯
            if (isAutoPan && pannerNode) {
                const panVal = Math.sin(Date.now() / 600) * 0.6; // 在 -0.6 到 0.6 之間優雅搖擺
                pannerNode.pan.setTargetAtTime(panVal, audioCtx.currentTime, 0.1);
                const slider = document.getElementById('pan-slider');
                if (slider && document.activeElement !== slider) {
                    slider.value = panVal.toFixed(2);
                }
            }

            animationFrameId = requestAnimationFrame(updateVisualizer);
        }

        window.toggleAutoPan = function() {
            isAutoPan = !isAutoPan;
            const btn = document.getElementById('auto-pan-btn');
            if (btn) btn.classList.toggle('active', isAutoPan);
        }

        window.setManualPan = function(val) {
            isAutoPan = false;
            const btn = document.getElementById('auto-pan-btn');
            if (btn) btn.classList.remove('active');
            if (pannerNode && audioCtx) {
                pannerNode.pan.setTargetAtTime(parseFloat(val), audioCtx.currentTime, 0.05);
            }
        }

        window.toggleBassBoost = function() {
            isBassBoosted = !isBassBoosted;
            const targetGain = isBassBoosted ? 12 : 0;
            if (bassFilter && audioCtx) {
                bassFilter.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 0.1);
            }
            const btn = document.getElementById('bass-boost-btn');
            if (btn) btn.classList.toggle('active', isBassBoosted);
        }

        window.playSong = function(index) {
            currentIndex = index;
            const song = playlist[currentIndex];
            if (!song) return;
            
            hasCountedCurrentSong = false;
            addHistory(song.url);

            audio.src = song.url;
            initWebAudio();
            audio.play();
            isPlaying = true;
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            updateVisualizer();

            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            playerTitle.innerText = song.title;
            modalSongTitle.innerText = song.title;
            modalSongArtist.innerText = song.artist;
            playerThumb.src = song.cover;
            modalCover.src = song.cover;
            modalBlurBg.style.backgroundImage = `url('${song.cover}')`;
            playerStatus.innerText = t.playerPlaying;
            
            durationTimeEl.innerText = song.duration || "3:30";
            modalDurationTimeEl.innerText = song.duration || "3:30";

            playIcon.innerHTML = pauseSvg;
            modalPlayIcon.innerHTML = pauseSvg;
        }

        window.togglePlayPause = function() {
            const savedLang = (JSON.parse(localStorage.getItem('fr_music_settings')) || {}).language || 'zh-TW';
            const t = translations[savedLang] || translations['zh-TW'];

            if (!audio.src && playlist.length > 0) {
                window.playSong(0);
                return;
            }
            initWebAudio();
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playIcon.innerHTML = playSvg;
                modalPlayIcon.innerHTML = playSvg;
                playerStatus.innerText = t.playerPaused;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            } else {
                audio.play();
                isPlaying = true;
                playIcon.innerHTML = pauseSvg;
                modalPlayIcon.innerHTML = pauseSvg;
                playerStatus.innerText = t.playerPlaying;
                updateVisualizer();
            }
        }

        window.nextSong = function() {
            currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
            window.playSong(currentIndex);
        }

        window.prevSong = function() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            window.playSong(currentIndex);
        }

        window.skipTime = function(seconds) {
            if (!audio.duration) return;
            audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds));
        }

        window.toggleShuffle = function() {
            isShuffle = !isShuffle;
            document.querySelectorAll('.shuffle-trigger').forEach(b => b.classList.toggle('active', isShuffle));
        }

        window.toggleRepeat = function() {
            isRepeat = !isRepeat;
            document.querySelectorAll('.repeat-trigger').forEach(b => b.classList.toggle('active', isRepeat));
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100;
                updateProgressUI(percent);
                
                if (percent >= 50 && !hasCountedCurrentSong) {
                    hasCountedCurrentSong = true;
                    const song = playlist[currentIndex];
                    if (song) incrementPlayCount(song.url);
                }

                const formattedCurrent = formatTime(audio.currentTime);
                const song = playlist[currentIndex];
                const formattedDuration = (song && song.duration) ? song.duration : formatTime(audio.duration);
                
                currentTimeEl.innerText = formattedCurrent;
                durationTimeEl.innerText = formattedDuration;
                modalCurrentTimeEl.innerText = formattedCurrent;
                modalDurationTimeEl.innerText = formattedDuration;
            }
        });

        function updateProgressUI(percent) {
            progressFilled.style.width = percent + '%';
            modalProgressFilled.style.width = percent + '%';
        }

        let isDragging = false;
        
        function setupSeekBar(barId) {
            const bar = document.getElementById(barId);
            if(!bar) return;

            const getPercent = (e) => {
                const rect = bar.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            };

            let currentPercent = 0;
            const onStart = (e) => { 
                if (!audio.duration) return; 
                isDragging = true; 
                currentPercent = getPercent(e);
                updateProgressUI(currentPercent * 100); 
            };
            const onMove = (e) => {
                if (!isDragging || !audio.duration) return;
                currentPercent = getPercent(e);
                requestAnimationFrame(() => {
                    updateProgressUI(currentPercent * 100);
                    currentTimeEl.innerText = formatTime(currentPercent * audio.duration);
                    modalCurrentTimeEl.innerText = formatTime(currentPercent * audio.duration);
                });
            };
            const onEnd = (e) => {
                if (!isDragging || !audio.duration) return;
                isDragging = false;
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const rect = bar.getBoundingClientRect();
                audio.currentTime = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) * audio.duration;
            };

            bar.addEventListener('mousedown', onStart);
            bar.addEventListener('mousemove', onMove);
            bar.addEventListener('mouseup', onEnd);
            bar.addEventListener('touchstart', onStart, {passive: true});
            bar.addEventListener('touchmove', onMove, {passive: true});
            bar.addEventListener('touchend', onEnd);
        }

        setupSeekBar('progress-bar');
        setupSeekBar('modal-progress-bar');

        window.setVolume = function(val) {
            audio.volume = val;
            localStorage.setItem('fr_music_volume', val);
            if (val > 0 && isMuted) {
                isMuted = false;
            }
        }

        window.toggleMute = function() {
            if (isMuted) {
                audio.volume = previousVolume > 0 ? previousVolume : 0.5;
                isMuted = false;
            } else {
                previousVolume = audio.volume;
                audio.volume = 0;
                isMuted = true;
            }
            document.getElementById('volume-slider').value = audio.volume;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        audio.addEventListener('ended', () => {
            if (isRepeat) { audio.play(); } else { window.nextSong(); }
        });

        window.openModal = function() { document.getElementById('now-playing-modal').classList.add('open'); }
        window.closeModal = function() { document.getElementById('now-playing-modal').classList.remove('open'); }
    </script>
</body>
